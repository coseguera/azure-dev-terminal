# Heavy profile -- a dedicated VM for sustained heavy work, WITH auto-shutdown.
#
# Use with:  ./provision.sh vm.heavy.conf
#
# When work is sustained high-CPU (long compiles, heavy indexing), a burstable VM
# exhausts its credits and throttles to baseline -- the signal to move to a DEDICATED
# D-series. A dedicated 4-core is too expensive to run 24/7 under the budget, so this
# profile ships with a daily auto-shutdown (deallocate). Dedicated SKUs have no burst
# credits to lose, so stopping carries no penalty; restart on demand via connect.sh.

# --- Where / what to name things ---
LOC="westus2"                   # Azure region
RG="rg-azure-dev-terminal"      # resource group name
VM="azure-dev-terminal"         # VM name
ADMIN="azureuser"               # local admin used only by `az vm create`; locked out by cloud-init
IMAGE="Ubuntu2404"              # marketplace image alias

# --- Size & disk ---
SIZE="Standard_D4as_v5"         # dedicated, 4 vCPU / 16 GB (constant performance)
OSDISK_GB="64"                  # OS disk size in GB (>= the image's base size)
DISK_SKU="Premium_LRS"          # Premium for snappier sustained I/O

# --- Operational ---
JIT_MAX_DURATION="PT3H"         # max JIT access window users may request

# --- Auto-shutdown (control-plane backstop) ---
# UTC HHMM. Dedicated SKUs must NOT run always-on under the budget, so set a daily
# deallocate time. The VM restarts on demand when you next connect.
AUTOSHUTDOWN_UTC="0900"
