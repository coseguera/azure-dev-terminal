# Lean / budget profile (default, recommended) -- always-on under the budget.
#
# Use with:  ./provision.sh           (defaults to this file)
#       or:  ./provision.sh vm.lean.conf
#
# A burstable B-series VM: terminal Copilot CLI + LazyVim is near-idle most of the
# time (banking CPU credits) with short bursts (LSP indexing, builds). Burstable VMs
# RESET their credit balance when deallocated, so the lean profile runs ALWAYS-ON
# (no auto-shutdown) -- which both banks a full credit balance and fits the budget.

# --- Where / what to name things ---
LOC="westus2"                   # Azure region
RG="rg-azure-dev-terminal"      # resource group name
VM="azure-dev-terminal"         # VM name
ADMIN="azureuser"               # local admin used only by `az vm create`; locked out by cloud-init
IMAGE="Ubuntu2404"              # marketplace image alias

# --- Size & disk ---
SIZE="Standard_B2as_v2"         # burstable, 2 vCPU / 8 GB
OSDISK_GB="64"                  # OS disk size in GB (>= the image's base size)
DISK_SKU="StandardSSD_LRS"      # StandardSSD_LRS (cheap) or Premium_LRS (snappier I/O)

# --- Operational ---
JIT_MAX_DURATION="PT3H"         # max JIT access window users may request

# --- Auto-shutdown (control-plane backstop) ---
# Empty = OFF (always-on). Burstable banks credits while idle and fits budget 24/7,
# so the lean profile stays always-on. See vm.heavy.conf for the dedicated case.
AUTOSHUTDOWN_UTC=""
